name: vendas-api
metadata:
  template: vendas-api@0.0.1
services:
  api:
    project: .
    language: python
    host: appservice
    hooks:
      prepackage:
        windows:
          shell: pwsh
          run: |
            npm --prefix frontend ci
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            npm --prefix frontend run build
            exit $LASTEXITCODE
          interactive: false
        posix:
          shell: sh
          run: |
            npm --prefix frontend ci
            npm --prefix frontend run build
          interactive: false
